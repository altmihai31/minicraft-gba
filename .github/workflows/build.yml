# Builds the normal and debug ROMs on every push and pull request.
# Pushing a tag 'ee-v*' (e.g. ee-v1.0) also creates a GitHub release with
# both ROMs and the matching CHANGELOG.md section as its notes.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # the version the project is measured with: older compilers make
      # bigger IWRAM code, which may not fit
      - name: Arm GNU toolchain 14.2.Rel1
        run: |
          curl -sSfL -o toolchain.tar.xz https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
          mkdir -p "$HOME/arm"
          tar -xf toolchain.tar.xz -C "$HOME/arm" --strip-components=1
          echo "$HOME/arm/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow
        run: pip install pillow

      - name: Build
        run: |
          make -C lib/libsimplegba
          make res
          make build
          make build DEBUG_KIT=1
          python tools/check-header.py bin/minicraft-expanded-edition.gba
          python tools/check-header.py bin/minicraft-expanded-edition-debug.gba

      - uses: actions/upload-artifact@v4
        with:
          name: minicraft-expanded-edition
          path: |
            bin/minicraft-expanded-edition.gba
            bin/minicraft-expanded-edition-debug.gba

  release:
    if: startsWith(github.ref, 'refs/tags/ee-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: minicraft-expanded-edition
          path: rom

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest CHANGELOG.md section, without its heading
          awk '/^## \[/ { n++; next } n == 1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" rom/*.gba \
            --title "Minicraft Expanded Edition ${GITHUB_REF_NAME#ee-v}" \
            --notes-file notes.md
